# OceanPulse Obs Center — nginx reverse proxy
# Terminates TLS using the host's Let's Encrypt cert and proxies to the
# Flask app on 127.0.0.1:5000. HTTP redirects to HTTPS.
#
# The cert path is the OVH-issued cert for the VPS hostname. If deploying
# to a different host, swap the ssl_certificate paths or use certbot to
# generate new ones.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/vps-1f52b6a8.vps.ovh.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps-1f52b6a8.vps.ovh.net/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static {
        alias /home/lab/oceanpulse/obs_center/static;
    }
}
